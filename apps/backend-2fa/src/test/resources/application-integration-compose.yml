# Perfil integration-compose - IT de CONTEXTO COMPLETO contra docker-compose (sin Testcontainers).
# DEBT-062 (S27): reconstruido = ORIGINAL (8eee244, autosuficiente para los 17 IT) + deltas it-db:
#   datasource->bankportal_it, redis->redis-it:6381 sin auth, + bloque application.security.jwt (DEBT-064).
# Precondicion: docker compose -f docker-compose.yml -f docker-compose.it.yml up -d postgres redis-it
#   + it-db/it-db-setup.sql (rol+BD bankportal_it).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bankportal_it
    username: bankportal_it
    password: it_local_only
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: localhost
      port: 6381  # redis-it efimero sin auth (DEBT-064)
  mail:
    host: localhost
    port: 25
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

totp:
  aes-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  issuer: BankMeridianIntTest
  period: 30
  code-digits: 6
  tolerance: 1

jwt:
  secret: integration-test-jwt-secret-must-be-at-least-256-bits-long-for-hs256-ok
  pre-auth-secret: integration-test-pre-auth-secret-must-be-at-least-256-bits-long-ok
  pre-auth-ttl-seconds: 300
  session-ttl-seconds: 28800

application:
  security:
    jwt:
      secret-key: test-jwt-secret-key-minimum-32-characters-for-hmac
      expiration: 3600000

bank:
  core:
    base-url: http://localhost:9999
    api-key: dummy-key-for-integration-tests
  products:
    loan:
      tae: 5.00
    deposit:
      tin: 3.50
      tae: 3.57
  bizum:
    limit:
      per-operation: 500
      per-day: 2000
    request:
      ttl-hours: 24
  savings:
    max-active-goals-per-user: 10
    target-amount:
      min: 100
      max: 500000
    contribution:
      min: 10
      max: 5000
    target-date:
      min-days-ahead: 30
      max-years-ahead: 30
    auto:
      cron: '0 0 2 * * *'
      lock-max: 30m
      lock-min: 1m
      page-size: 200
      retry:
        max-attempts: 3
        backoff: [60s, 300s, 900s]
    closure:
      sca-threshold: 30.00

notifications:
  push:
    vapid-public-key: BDummyVapidPublicKeyForIntegrationTestsOnlyNotRealKey12345678
    vapid-private-key: DummyVapidPrivateKeyForIntegrationTestsOnlyNotRealKey1234

notification:
  email:
    from: no-reply@integration-test.local
    deny-base-url: http://localhost:8080/session/deny

trusted-device:
  hmac-key: dummy-hmac-key-for-integration-tests-only-not-real

kyc:
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

session:
  deny-link:
    hmac-key: dummy-session-deny-link-hmac-key-for-integration-tests

server:
  port: 0
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.experis.sofia.bankportal: INFO
    org.flywaydb: INFO
