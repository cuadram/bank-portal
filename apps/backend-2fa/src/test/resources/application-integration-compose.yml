# DEBT-064 (S27) - Perfil integration-compose
# IT de CONTEXTO COMPLETO contra servicios docker-compose (sin Testcontainers).
# Cubre TODOS los placeholders obligatorios (sin default) del contexto completo
# (barrido de ${...} en src/main/java: @Value + @Scheduled + @SchedulerLock).
# Precondicion: compose up (postgres+redis) + it-db/it-db-setup.sql (rol+BD bankportal_it).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bankportal_it
    username: bankportal_it
    password: it_local_only
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: localhost
      port: 6381  # redis-it efimero sin auth (DEBT-064)
  mail:
    host: localhost
    port: 1025
application:
  security:
    jwt:
      secret-key: test-jwt-secret-key-minimum-32-characters-for-hmac
      expiration: 3600000
notifications:
  push:
    vapid-public-key: "test-vapid-public-key-not-used-in-it"
    vapid-private-key: "test-vapid-private-key-not-used-in-it"
notification:
  email:
    from: "no-reply@bancomeridian.es"
    deny-base-url: "http://localhost:4201/deny"
bank:
  core:
    base-url: "http://localhost:9999"
    api-key: "test-core-api-key"
  products:
    deposit:
      tin: 0.0325
      tae: 0.0330
    loan:
      tae: 6.95
  savings:
    auto:
      cron: "0 0 2 * * *"
      lock-max: "30m"
      lock-min: "1m"
session:
  deny-link:
    hmac-key: "test-session-deny-link-hmac-key-32bytes-min-ok"
trusted-device:
  hmac-key: "test-trusted-device-hmac-key-32bytes-min-ok"
